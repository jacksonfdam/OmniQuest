<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0d12"/>
<meta name="description" content="OmniQuest — gamified, multi-subject learning quests."/>
<title>OmniQuest</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
<link rel="manifest" href="manifest.json"/>
<link rel="stylesheet" href="css/styles.css"/>
</head>
<body>

<!-- App shell -->
<div id="app" class="app" data-fx="standard">

  <!-- HUD -->
  <header class="hud" id="hud" role="banner">
    <a class="hud__brand" href="#" data-route="map" aria-label="Voltar ao mapa">
      <span class="hud__logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28"><path d="M16 4 L26 10 V22 L16 28 L6 22 V10 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M11 16 L15 20 L22 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="hud__word">Omni<span class="hud__word--accent">Quest</span></span>
    </a>

    <div class="hud__stats" id="hud-stats" aria-live="polite">
      <span class="chip chip--lv"  title="Level"><b id="stat-lv">1</b><i>LV</i></span>
      <span class="chip chip--xp"  title="XP"><b id="stat-xp">0</b><i>XP</i></span>
      <span class="chip chip--st"  title="Stars"><b id="stat-st">0</b><i>★</i></span>
    </div>

    <nav class="hud__nav" aria-label="Navegação">
      <button class="iconbtn" type="button" data-route="codex"  aria-label="Codex">📚</button>
      <button class="iconbtn" type="button" data-route="about"  aria-label="Sobre">ℹ️</button>
      <button class="iconbtn" type="button" data-route="credits" aria-label="Créditos">?</button>
    </nav>
  </header>

  <!-- Views -->
  <main class="view" id="view-map" data-view="map">
    <div class="map" id="map" aria-label="Mapa de jornada"></div>
    <div class="map__legend" id="map-legend" aria-hidden="true"></div>
  </main>

  <main class="view is-hidden" id="view-codex" data-view="codex">
    <div class="codex" id="codex"></div>
  </main>

  <main class="view is-hidden" id="view-about" data-view="about">
    <section class="page" id="about"></section>
  </main>

  <main class="view is-hidden" id="view-credits" data-view="credits">
    <section class="page" id="credits"></section>
  </main>

</div>

<!-- Modal root -->
<div class="modal-root" id="modal-root" aria-hidden="true"></div>

<!-- Achievement toasts -->
<div class="ach-stack" id="ach-stack" aria-live="polite" aria-atomic="false"></div>

<!-- Splash overlay -->
<div class="splash" id="splash">
  <div class="splash__logo" aria-hidden="true">
    <svg viewBox="0 0 64 64" width="84" height="84"><path d="M32 8 L52 20 V44 L32 56 L12 44 V20 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M22 32 L30 40 L44 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h1 class="splash__title">OmniQuest</h1>
  <p class="splash__tag"><i>Aprenda jogando. Bilíngue PT/SV.</i></p>
  <button class="splash__cta is-hidden" id="splash-install" type="button">📲 Add to Home Screen</button>
  <p class="splash__hint is-hidden" id="splash-hint">No iPhone: toque em <b>Compartilhar ⤴</b> e então <b>Adicionar à Tela de Início</b>.</p>
  <p class="splash__skip">Toque para continuar</p>
</div>

<!-- Anti-tamper veil placeholder -->
<div class="veil is-hidden" id="veil" aria-hidden="true"></div>

<!-- Scripts (order matters; build adds ?v=hash) -->
<script src="js/anti-tamper.js"></script>
<script src="js/integrity.js"></script>
<script src="js/state.js"></script>
<script src="js/markdown.js"></script>
<script src="js/data.js"></script>
<script src="js/library.js"></script>
<script src="js/achievements.js"></script>
<script src="js/quiz.js"></script>
<script src="js/fx.js"></script>
<script src="js/map.js"></script>
<script src="js/splash.js"></script>
<script src="js/app.js"></script>
</body>
</html>
